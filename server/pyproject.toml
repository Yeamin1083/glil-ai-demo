[project]
name = "glil-ai-demo-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "google-genai>=3.3.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
